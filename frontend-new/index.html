<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe-Guard - Security Scanner</title>
    <meta name="description" content="Zero-dependency security scanner for modern applications. Detect vulnerabilities, secure your code, and protect your applications.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/logo-black-square.svg">
</head>
<body class="text-white">
    <!-- Loading placeholder -->
    <div id="loading" class="min-h-screen flex items-center justify-center">
        <div class="text-center">
            <div class="w-16 h-16 bg-primary mx-auto mb-4"></div>
            <h1 class="text-2xl font-black tracking-tight">VIBE-GUARD</h1>
            <p class="text-muted-foreground mt-2">Loading...</p>
        </div>
    </div>

    <!-- Main app container -->
    <div id="app" class="hidden">
        <!-- Content will be rendered here by JavaScript -->
    </div>

    <!-- Modular JavaScript -->
    <script type="module" src="app-modular.js"></script>
</body>
</html>
