name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }} (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Type Check (fast fail)
        run: npx tsc --noEmit

      - name: Check for lint script
        id: check-lint
        run: |
          # detect if a lint script exists in package.json and expose as output
          if grep -q '"lint"' package.json; then
            echo "has-lint=true" >> $GITHUB_OUTPUT
          else
            echo "has-lint=false" >> $GITHUB_OUTPUT
          fi

      - name: Lint
        if: steps.check-lint.outputs.has-lint == 'true'
        run: npm run lint

      - name: Build (TypeScript)
        run: npm run build

      - name: Run Jest Tests (optional) and produce JSON
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CI: true
        run: |
          # run jest and write JSON output for conversion
          npx jest --json --outputFile=jest-output.json || true

      - name: Convert Jest JSON to SARIF
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/jest-to-sarif.js jest-output.json test-results.sarif || true

      - name: Upload Jest SARIF (optional)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: test-results.sarif

  package-artifacts:
    name: Package Binaries (optional)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18.x (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        run: npm run package:all

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: vibe-guard-binaries
          path: |
            binaries/*
