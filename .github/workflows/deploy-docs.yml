name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Build documentation
      run: npm run docs:build
      
    - name: Copy binaries and docs
      run: |
        mkdir -p dist/docs/binaries
        cp -r binaries/* dist/docs/binaries/ 2>/dev/null || true
        cp README.md dist/docs/
        cp LICENSE dist/docs/
        cp CHANGELOG.md dist/docs/
      
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist/docs'
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.repository_owner == 'Devjosef'
      id: deployment
      uses: actions/deploy-pages@v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 