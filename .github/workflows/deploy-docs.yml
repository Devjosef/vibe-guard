name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Build documentation
      run: npm run docs:build
      
    - name: Copy docs extras (resilient)
      run: |
        mkdir -p dist/docs/binaries
        if [ -d binaries ]; then cp -r binaries/* dist/docs/binaries/ 2>/dev/null || true; fi
        [ -f README.md ] && cp README.md dist/docs/ || true
        [ -f LICENSE ] && cp LICENSE dist/docs/ || true
        [ -f CHANGELOG.md ] && cp CHANGELOG.md dist/docs/ || true
        # Ensure all assets are copied
        if [ -d frontend-new/assets ]; then cp -r frontend-new/assets/* dist/docs/assets/ 2>/dev/null || true; fi
      
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist/docs'
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      id: deployment
      uses: actions/deploy-pages@v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 