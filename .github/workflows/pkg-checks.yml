name: Packaging checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  packaging-checks:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify manifests version matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $VERSION"
          files=(
            "scripts/chocolatey/vibe-guard.nuspec"
            "Formula/vibe-guard.rb"
            "scripts/homebrew/vibe-guard.rb"
            "scripts/homebrew-tap/vibe-guard.rb"
          )
          for f in "${files[@]}"; do
            if ! grep -q "$VERSION" "$f"; then
              echo "Version mismatch: $f does not contain $VERSION"
              exit 1
            fi
          done

      - name: Build platform-specific package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npm run package:windows

      - name: Update Chocolatey checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = "binaries\vibe-guard-windows-x64.exe"
          if (-not (Test-Path $exePath)) { 
            Write-Error "Binary not found: $exePath"
            exit 1 
          }
          
          $checksum = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()
          Write-Host "Computed checksum: $checksum"
          
          $ps1Path = "scripts\chocolatey\tools\chocolateyInstall.ps1"
          Write-Host "Reading from: $ps1Path"
          
          $content = Get-Content $ps1Path -Raw
          $originalContent = $content
          
          # Replace the placeholder - match the exact format in the file
          $content = $content -replace '\{\{\s*CHECKSUM\s*\}\}', $checksum
          
          if ($content -eq $originalContent) {
            Write-Host "Pattern not replaced. File content:"
            Write-Host $originalContent
            Write-Error "Checksum placeholder pattern not found in $ps1Path"
            exit 1
          }
          
          Write-Host "Pattern replaced successfully"
          Set-Content -Path $ps1Path -Value $content -NoNewline -Encoding UTF8
          
          Write-Host "File updated:"
          Get-Content $ps1Path


      - name: Compute Windows checksum and verify Chocolatey
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $win = 'binaries\vibe-guard-windows-x64.exe'
          if (-not (Test-Path $win)) { Write-Error "Windows binary not found: $win"; exit 1 }
          $computed = (Get-FileHash -Algorithm SHA256 $win).Hash.ToLower()
          
          $ps1Path = 'scripts\chocolatey\tools\chocolateyInstall.ps1'
          Write-Host "Reading from: $ps1Path"
          
          if (-not (Test-Path $ps1Path)) {
            Write-Error "Script file not found: $ps1Path"
            exit 1
          }
          
          $script = [System.IO.File]::ReadAllText($ps1Path)
          Write-Host "File content (first 500 chars):"
          Write-Host $script.Substring(0, [Math]::Min(500, $script.Length))
          
          if ($script -match "\`$checksum\s*=\s*'([0-9A-Fa-f]{64})'") { 
            $expected = $matches[1].ToLower() 
          } else { 
            $expected = '' 
          }
          
          Write-Host "computed: $computed"
          Write-Host "expected: $expected"
          
          if ($expected -eq '') { 
            Write-Error "Could not extract Chocolatey checksum. Script content:"
            Write-Host $script
            exit 1 
          }
          
          if ($computed -ne $expected) { 
            Write-Error "Chocolatey checksum mismatch (computed != expected)"; exit 1 
          }
          
          Write-Host "Checksum verified successfully!"

      - name: Run Windows binary and assert version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = 'binaries\\vibe-guard-windows-x64.exe'
          if (-not (Test-Path $exe)) { Write-Error "Windows binary not found: $exe"; exit 1 }
          $out = & $exe --version 2>&1
          Write-Host "exe output: $out"
          if ($out -notmatch $version) { Write-Error "Windows binary --version does not include $version"; exit 1 }

      - name: Verify Homebrew tarball sha matches formula
        if: runner.os != 'Windows'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TGZ="/tmp/vibe-guard-v${VERSION}.tar.gz"
          curl -L -s -o "$TGZ" "https://github.com/Devjosef/vibe-guard/archive/refs/tags/v${VERSION}.tar.gz"
          computed=$(shasum -a 256 "$TGZ" | awk '{print $1}')
          expected=$(awk -F'"' '/sha256/ {print $2; exit}' Formula/vibe-guard.rb)
          echo "computed: $computed"
          echo "expected: $expected"
          if [ "$computed" != "$expected" ]; then
            echo "Homebrew sha256 mismatch"
            exit 1
          fi

      - name: Verify built binaries (cross-platform)
        run: |
          node scripts/verify-binaries.js