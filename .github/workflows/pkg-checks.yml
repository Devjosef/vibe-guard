name: Packaging checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  packaging-checks:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            package_script: package:linux
            required_binaries: vibe-guard-linux-x64,vibe-guard-linux-arm64
            artifact_suffix: linux
          - runner: macos-latest
            package_script: package:macos
            required_binaries: vibe-guard-macos-x64,vibe-guard-macos-arm64
            artifact_suffix: macos
          - runner: windows-latest
            package_script: package:windows
            required_binaries: vibe-guard-windows-x64.exe
            artifact_suffix: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify manifests version matches package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $VERSION"
          files=(
            "Formula/vibe-guard.rb"
            "scripts/homebrew/vibe-guard.rb"
            "scripts/homebrew-tap/vibe-guard.rb"
          )
          for f in "${files[@]}"; do
            if ! grep -q "$VERSION" "$f"; then
              echo "Version mismatch: $f does not contain $VERSION"
              exit 1
            fi
          done

      - name: Build platform-specific packages
        shell: bash
        run: npm run "${{ matrix.package_script }}"

      - name: Run Windows binary and assert version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = 'binaries\\vibe-guard-windows-x64.exe'
          if (-not (Test-Path $exe)) { Write-Error "Windows binary not found: $exe"; exit 1 }
          $out = & $exe --version 2>&1
          Write-Host "exe output: $out"
          if ($out -notmatch $version) { Write-Error "Windows binary --version does not include $version"; exit 1 }

      - name: Verify Homebrew tarball sha matches formula
        if: runner.os == 'macOS'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TGZ="/tmp/vibe-guard-v${VERSION}.tar.gz"
          curl -L -s -o "$TGZ" "https://github.com/Devjosef/vibe-guard/archive/refs/tags/v${VERSION}.tar.gz"
          computed=$(shasum -a 256 "$TGZ" | awk '{print $1}')
          expected=$(awk -F'"' '/sha256/ {print $2; exit}' Formula/vibe-guard.rb)
          echo "computed: $computed"
          echo "expected: $expected"
          if [ "$computed" != "$expected" ]; then
            echo "Homebrew sha256 mismatch"
            exit 1
          fi

      - name: Verify required binaries
        env:
          REQUIRED_BINARIES: ${{ matrix.required_binaries }}
        run: |
          node scripts/verify-binaries.js

      - name: Verify Linux binary architectures
        if: runner.os == 'Linux'
        run: |
          file binaries/vibe-guard-linux-x64 | grep -Eq 'ELF 64-bit.*x86-64'
          file binaries/vibe-guard-linux-arm64 | grep -Eq 'ELF 64-bit.*ARM aarch64'

      - name: Upload platform binaries
        uses: actions/upload-artifact@v4
        with:
          name: vibe-guard-binaries-${{ matrix.artifact_suffix }}
          path: binaries/*