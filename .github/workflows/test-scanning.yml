name: Test Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-scan:
    name: Test Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests and generate SARIF
        run: |
          npx jest --json --outputFile=jest-output.json
          node scripts/jest-to-sarif.js jest-output.json test-results.sarif
          results_count=$(jq '.runs[0].results | length' test-results.sarif)
          echo "SARIF_RESULTS=$results_count" >> $GITHUB_ENV

      - name: Upload SARIF file
        if: env.SARIF_RESULTS != '0'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: test-results.sarif
          category: test-results

      - name: Skip SARIF upload (no failures)
        if: env.SARIF_RESULTS == '0'
        run: echo "No SARIF results to upload (no failed tests)"